name: Ubuntu 24.04 ROS 2 Jazzy deb

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - name: Install build tools and ROS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-colcon-common-extensions python3-rosdep dpkg-dev
          rosdep update
          rosdep install --from-paths . --ignore-src --rosdistro jazzy -r -y \
            --skip-keys "ewellix_interfaces mir_srvs mur_control"
      - name: Build package
        run: colcon build --merge-install --install-base build/install --packages-select match_mur_gui
      - name: Assemble Debian package
        shell: bash
        run: |
          version="$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("package.xml").getroot().findtext("version"))')"
          revision="${GITHUB_SHA:0:12}"
          python3 scripts/package_deb.py \
            --install-root build/install \
            --output "dist/match-mur-gui_${version}+git.${revision}_amd64.deb" \
            --version "${version}+git.${revision}"
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: match-mur-gui-ubuntu-24.04-ros-jazzy
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30
